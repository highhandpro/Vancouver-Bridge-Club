<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none" class="vbc-logo-svg">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Crest Emblem -->
  <g transform="translate(10, 10)">
    <rect x="5" y="5" width="70" height="70" rx="16" fill="url(#crestGrad)" stroke="#3b82f6" stroke-width="2.5" />
    
    <!-- Spade -->
    <path d="M 40 16 C 36 22 30 26 30 31 C 30 35 33 38 37 38 C 39 38 40 36.5 40 36.5 C 40 36.5 41 38 43 38 C 47 38 50 35 50 31 C 50 26 44 22 40 16 Z" fill="#ffffff"/>
    <path d="M 38 36 L 36 43 L 44 43 L 42 36 Z" fill="#ffffff"/>
    
    <!-- Heart -->
    <path d="M 23 52 C 20 48 16 48 14 51 C 12 54 12 57 15 60 L 23 67 L 31 60 C 34 57 34 54 32 51 C 30 48 26 48 23 52 Z" fill="#ef4444"/>
    
    <!-- Diamond -->
    <path d="M 57 48 L 64 56 L 57 64 L 50 56 Z" fill="#f59e0b"/>
    
    <!-- Club -->
    <g transform="translate(40, 60) scale(0.7)">
      <circle cx="-6" cy="-2" r="5" fill="#10b981"/>
      <circle cx="6" cy="-2" r="5" fill="#10b981"/>
      <circle cx="0" cy="-10" r="5" fill="#10b981"/>
      <path d="M -3 0 L -5 10 L 5 10 L 3 0 Z" fill="#10b981"/>
    </g>
  </g>
  
  <!-- Text Branding -->
  <text x="96" y="44" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="currentColor" letter-spacing="-0.5">VANCOUVER</text>
  <text x="245" y="44" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="700" fill="#2563eb" letter-spacing="-0.5">BRIDGE CLUB</text>
  
  <!-- Subtitle -->
  <text x="98" y="66" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#64748b" letter-spacing="0.8">ACBL UNIT 452 • CLUB #118489 • SW WASHINGTON</text>
</svg>
